# Déploiement PRODUCTION — sur tag vX.Y.Z (créé par deploy/deploy-release-on-github.ps1).
# Ne touche QUE l'app (code + assets) et applique les migrations en attente : les données de
# prod ne sont jamais recopiées depuis la preview.
#
# Prérequis : secrets CLOUDFLARE_API_TOKEN (jeton de compte : Workers Scripts:Edit + D1:Edit)
# et CLOUDFLARE_ACCOUNT_ID ; D1 `condat-judo` créée, database_id renseigné dans app/wrangler.toml.
# Sauvegarde : D1 Time Travel (30 jours). Snapshot hors-Cloudflare avant migration : au backlog.
name: Deploy

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deployer:
    name: Migrations + déploiement prod
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Garde-fou : le tag doit correspondre à la version de app/package.json.
      - name: Contrôle version du tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ≠ version app/package.json (v$version)"
            exit 1
          fi

      - run: npm ci
      - run: npx wrangler d1 migrations apply condat-judo --remote
      - run: npm run build:web
      - run: npx wrangler deploy
