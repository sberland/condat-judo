# Déploiement PREVIEW (qualification) — sur push de la branche `preview`, ou manuellement.
# Worker + D1 DÉDIÉS (condat-judo-preview), isolés de la prod : on recopie la D1 de prod
# (LECTURE SEULE sur la prod) dans la D1 de preview, on applique les migrations, puis on déploie.
#
# Prérequis (cf. workspace/workflow-deploy-spe.md § Setup initial) :
#  - Secrets CLOUDFLARE_API_TOKEN (jeton de COMPTE : Workers Scripts:Edit + D1:Edit — un jeton
#    utilisateur est refusé par `d1 export`) et CLOUDFLARE_ACCOUNT_ID.
#  - D1 `condat-judo-preview` créée, database_id renseigné dans app/wrangler.toml [env.preview].
#  - Host de preview couvert par une application Cloudflare Access (la preview contient une copie
#    des données réelles).
name: Preview

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  deployer:
    name: Refresh D1 + déploiement preview
    runs-on: ubuntu-latest
    environment:
      name: preview
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      # 1. Export de la prod — LECTURE SEULE, n'écrit jamais sur la prod.
      - name: Export D1 prod (lecture seule)
        run: npx wrangler d1 export condat-judo --remote --output "$RUNNER_TEMP/prod-snapshot.sql"

      # 2. Purge de la D1 de preview avant réimport.
      #    ⚠️ Toute nouvelle table créée par une migration doit être ajoutée ici (ordre = FK :
      #    enfants avant parents), comme dans db:reset:local et deploy/refresh-preview-db.ps1.
      - name: Purge D1 preview
        run: >
          npx wrangler d1 execute condat-judo-preview --env preview --remote --yes --command
          "DROP TABLE IF EXISTS liens; DROP TABLE IF EXISTS personnes_autorisees; DROP TABLE IF EXISTS identites; DROP TABLE IF EXISTS user_roles; DROP TABLE IF EXISTS adherents; DROP TABLE IF EXISTS saisons; DROP TABLE IF EXISTS users; DROP TABLE IF EXISTS d1_migrations;"

      # 3. Import du snapshot prod (sauté si la prod est encore vide).
      - name: Import du snapshot prod
        run: |
          if grep -q -E '^(CREATE|INSERT)' "$RUNNER_TEMP/prod-snapshot.sql"; then
            npx wrangler d1 execute condat-judo-preview --env preview --remote --yes --file "$RUNNER_TEMP/prod-snapshot.sql"
          else
            echo "Snapshot prod vide : import sauté."
          fi

      # 4. Migrations plus récentes que le snapshot prod.
      - run: npx wrangler d1 migrations apply condat-judo-preview --env preview --remote

      # 5. Build du front puis déploiement du Worker de preview.
      - run: npm run build:web
      - run: npx wrangler deploy --env preview
