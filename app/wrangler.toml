name = "condat-judo"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
# account_id non épinglé : fourni par CLOUDFLARE_ACCOUNT_ID (secret GitHub) en CI,
# ou par `wrangler login` sur le poste.

# URL : https://condat-judo.sebastien-berland.workers.dev — site public (pas de Cloudflare Access).
workers_dev = true
# Pas d'URL de version (<version>-condat-judo.…workers.dev) : une seule URL par environnement
# (en preview, elles échapperaient au verrou Access posé sur le nom d'hôte).
preview_urls = false

[vars]
ENVIRONMENT = "production"

# Front React (build Vite) servi par Workers Assets. SPA : toute route non-fichier renvoie
# index.html (routing client TanStack). /api/* passe TOUJOURS par le Worker (run_worker_first),
# y compris pour une navigation directe dans le navigateur.
# ⚠️ Nécessite `npm run build:web` avant `wrangler dev` / `wrangler deploy`.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 de PRODUCTION — porte les données réelles des familles.
# ⚠️ Jamais de seed ni de reset en --remote : le seed (src/db/seed.sql) est réservé au --local.
[[d1_databases]]
binding = "DB"
database_name = "condat-judo"
database_id = "a58cc624-13af-44f2-a8b8-4bb600656a43"   # créée le 2026-09-23 (--jurisdiction eu)
migrations_dir = "src/db/migrations"

# ─────────────────────────────────────────────────────────────────────────────
# Environnement de PREVIEW (qualification) — Worker + D1 DÉDIÉS, isolés de la prod.
#
# • Worker déployé : `condat-judo-preview` (suffixe `-preview` automatique).
# • D1 dédiée `condat-judo-preview` : (re)peuplée depuis un snapshot prod (lecture seule sur la
#   prod) par le workflow GitHub `preview.yml` ou `deploy/refresh-preview-db.ps1`.
# • ⚠️ Contient une COPIE des données réelles : l'accès au site est VERROUILLÉ par une application
#   Cloudflare Access (« Protéger ce Worker », tout le trafic — dashboard). Verrou d'accès uniquement :
#   aucune identité n'est transmise à l'app, qui a sa propre authentification (cf. cloudflare-access.md).
# ─────────────────────────────────────────────────────────────────────────────
[env.preview]
# URL : https://condat-judo-preview.sebastien-berland.workers.dev (tout le host derrière le verrou Access)
workers_dev = true
preview_urls = false

[env.preview.vars]
ENVIRONMENT = "preview"

[env.preview.assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "condat-judo-preview"
database_id = "0bf6338c-68df-4fdd-971d-ee53bae1b1ff"   # créée le 2026-09-23 (--jurisdiction eu)
migrations_dir = "src/db/migrations"
